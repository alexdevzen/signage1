<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco Publicitario</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            width: 100vw;
            height: 100vh;
        }
        
        #imageContainer {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        
        .slide.active {
            opacity: 1;
        }
        
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="imageContainer">
        <div id="loading">Cargando imágenes...</div>
    </div>

    <script>
        let images = [];
        let currentIndex = 0;
        let rotationTimer = null;
        let checkUpdateInterval = null;
        let lastModified = null;
        let isRotating = false;

        async function loadImages() {
            try {
                const response = await fetch('get_images.php?t=' + Date.now());
                const data = await response.json();
                
                if (data.success && data.images.length > 0) {
                    // Verificar si hay cambios en las imágenes
                    const imagesChanged = JSON.stringify(images) !== JSON.stringify(data.images);
                    
                    if (imagesChanged) {
                        console.log('Imágenes actualizadas, reiniciando rotación...');
                        images = data.images;
                        currentIndex = 0;
                        stopRotation();
                        displayImages();
                    } else if (images.length === 0) {
                        // Primera carga
                        images = data.images;
                        displayImages();
                    }
                } else {
                    document.getElementById('loading').textContent = 'No hay imágenes para mostrar';
                }
            } catch (error) {
                console.error('Error al cargar imágenes:', error);
                document.getElementById('loading').textContent = 'Error al cargar imágenes';
            }
        }

        function displayImages() {
            const container = document.getElementById('imageContainer');
            container.innerHTML = '';
            
            // Crear todos los slides
            images.forEach((img, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                if (index === 0) slide.classList.add('active');
                
                const imgElement = document.createElement('img');
                imgElement.src = 'uploads/' + img.filename + '?t=' + Date.now();
                imgElement.alt = 'Imagen publicitaria';
                
                slide.appendChild(imgElement);
                container.appendChild(slide);
            });
            
            // Iniciar rotación si hay más de una imagen
            if (images.length > 1) {
                startRotation();
            } else if (images.length === 1) {
                console.log('Solo hay una imagen, no se inicia rotación');
            }
        }

        function stopRotation() {
            if (rotationTimer) {
                clearTimeout(rotationTimer);
                rotationTimer = null;
            }
            isRotating = false;
        }

        function startRotation() {
            // Detener cualquier rotación previa
            stopRotation();
            
            isRotating = true;
            
            // Obtener la duración de la imagen actual
            const currentDuration = images[currentIndex].duration * 1000;
            
            console.log(`Mostrando imagen ${currentIndex + 1}/${images.length} por ${images[currentIndex].duration} segundos`);
            
            // Programar el siguiente cambio
            rotationTimer = setTimeout(() => {
                if (!isRotating) return; // Por si se detuvo externamente
                
                const slides = document.querySelectorAll('.slide');
                
                // Ocultar imagen actual
                slides[currentIndex].classList.remove('active');
                
                // Avanzar al siguiente índice
                currentIndex = (currentIndex + 1) % images.length;
                
                // Mostrar nueva imagen
                slides[currentIndex].classList.add('active');
                
                // Continuar la rotación
                startRotation();
            }, currentDuration);
        }

        function checkForUpdates() {
            // Verificar actualizaciones sin interrumpir la rotación actual
            fetch('get_images.php?t=' + Date.now())
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.images.length > 0) {
                        const imagesChanged = JSON.stringify(images) !== JSON.stringify(data.images);
                        
                        if (imagesChanged) {
                            console.log('Cambios detectados, recargando imágenes...');
                            loadImages();
                        }
                    }
                })
                .catch(error => {
                    console.error('Error al verificar actualizaciones:', error);
                });
        }

        // Cargar imágenes al inicio
        loadImages();
        
        // Verificar cambios cada 30 segundos SIN interrumpir la rotación
        checkUpdateInterval = setInterval(checkForUpdates, 30000);
        
        // Limpiar intervalos al cerrar la página
        window.addEventListener('beforeunload', () => {
            stopRotation();
            if (checkUpdateInterval) {
                clearInterval(checkUpdateInterval);
            }
        });
    </script>
</body>
</html>
