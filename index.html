<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagen Publicitaria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            width: 100vw;
            height: 100vh;
        }
        
        #imageContainer {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        
        .slide.active {
            opacity: 1;
        }
        
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="imageContainer">
        <div id="loading">Cargando imágenes...</div>
    </div>

    <script>
        let images = [];
        let currentIndex = 0;
        let rotationTimer = null;

        async function loadImages() {
            try {
                const response = await fetch('get_images.php');
                const data = await response.json();
                
                if (data.success && data.images.length > 0) {
                    images = data.images;
                    displayImages();
                } else {
                    document.getElementById('loading').textContent = 'No hay imágenes para mostrar';
                }
            } catch (error) {
                console.error('Error al cargar imágenes:', error);
                document.getElementById('loading').textContent = 'Error al cargar imágenes';
            }
        }

        function displayImages() {
            const container = document.getElementById('imageContainer');
            container.innerHTML = '';
            
            images.forEach((img, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                if (index === 0) slide.classList.add('active');
                
                const imgElement = document.createElement('img');
                imgElement.src = 'uploads/' + img.filename;
                imgElement.alt = 'Imagen publicitaria';
                
                slide.appendChild(imgElement);
                container.appendChild(slide);
            });
            
            if (images.length > 1) {
                startRotation();
            }
        }

        function startRotation() {
            if (rotationTimer) clearInterval(rotationTimer);
            
            const currentDuration = images[currentIndex].duration * 1000;
            
            rotationTimer = setTimeout(() => {
                const slides = document.querySelectorAll('.slide');
                slides[currentIndex].classList.remove('active');
                
                currentIndex = (currentIndex + 1) % images.length;
                slides[currentIndex].classList.add('active');
                
                startRotation();
            }, currentDuration);
        }

        // Cargar imágenes al inicio
        loadImages();
        
        // Recargar imágenes cada 30 segundos para detectar cambios
        setInterval(loadImages, 30000);
    </script>
</body>
</html>
